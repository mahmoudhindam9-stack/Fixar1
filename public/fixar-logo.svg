<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Dark Corporate Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Emerald Vibrant Accent Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cyan Electric Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Silver Steel Gradient -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#10b981" flood-opacity="0.3" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Glassmorphic Main Card -->
  <rect x="160" y="100" width="880" height="430" rx="32" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" filter="url(#cardShadow)" />

  <!-- Main Logo Emblem + Wordmark Group -->
  <g transform="translate(310, 215)">
    <!-- Shield / Wrench Geometric Emblem -->
    <g filter="url(#emeraldGlow)">
      <!-- Hexagon Shield Outer -->
      <polygon points="90,10 160,50 160,130 90,170 20,130 20,50" fill="url(#emeraldGrad)" />
      
      <!-- Inner Precision Wrench & F Integration (Cutout) -->
      <!-- Hex nut center opening -->
      <circle cx="90" cy="90" r="32" fill="#0b0f19" />
      
      <!-- Modern Wrench Notch Diagonal -->
      <path d="M 68,68 L 112,112 M 112,68 L 68,112" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round" />
      
      <!-- Glowing Center Core Node -->
      <circle cx="90" cy="90" r="10" fill="#ffffff" />
    </g>

    <!-- Brand Typography: FIXAR -->
    <!-- "FIX" in Steel White, "AR" in Emerald Green -->
    <text x="200" y="122" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="110" letter-spacing="-2">
      <tspan fill="url(#steelGrad)">FIX</tspan><tspan fill="url(#emeraldGrad)">AR</tspan>
    </text>

    <!-- Subtitle Badge -->
    <g transform="translate(205, 148)">
      <rect x="0" y="0" width="370" height="28" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      <text x="185" y="19" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#34d399" letter-spacing="4">
        FACILITY &amp; MAINTENANCE ERP
      </text>
    </g>
  </g>

  <!-- Developer Footer Tag -->
  <g transform="translate(600, 480)">
    <text x="0" y="0" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="13" fill="#64748b" letter-spacing="6">
      DEVELOPED BY LION CREATIVITY M.H
    </text>
  </g>
</svg>
